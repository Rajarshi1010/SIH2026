services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: geoai_backend
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      # Embedded DuckDB Vectorized Engine (Zero-Cost, In-Process)
      DUCKDB_PATH: ${DUCKDB_PATH:-data/india_geoai.db}
      # Redis Distributed Cache & Pub/Sub
      REDIS_HOST: redis_cache
      REDIS_PORT: 6379
      REDIS_URL: redis://redis_cache:6379/0
      # Application Configuration
      APP_ENV: ${APP_ENV:-development}
      DEBUG: ${DEBUG:-True}
      FIRMS_MAP_KEY: ${FIRMS_MAP_KEY:-}
      OPERATIONAL_BBOX: ${OPERATIONAL_BBOX:-68,6,98,38}
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:5173","http://127.0.0.1:5173"]'
    volumes:
      - ./Backend:/app
      - ./data:/app/data
      - ./Backend/artifacts:/app/artifacts
    depends_on:
      redis_cache:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - geoai_network

  redis_cache:
    image: redis:7-alpine
    container_name: geoai_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - geoai_network

networks:
  geoai_network:
    driver: bridge

volumes:
  redis_data:
